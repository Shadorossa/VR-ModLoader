[package]
name = "evt-example-engine"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Example VR-Framework engine: reads <mod>\\example\\*.toml of every mod that requires it, merges them into one generated file served with file_serve, and answers a Lua command"
publish = false

[lib]
# the DLL is named after the lib: example_engine.dll (mod.toml: plugin = "example_engine.dll")
name = "example_engine"
crate-type = ["cdylib"]

[dependencies]
# In a mod of your own, point these at wherever you keep the SDK and the framework (path, git or the registry).
evt-plugin-sdk = { path = "../../../crates/evt-plugin-sdk" }
vr-framework = { path = "../../../crates/vr-framework" }
serde = { version = "1", features = ["derive"] }

# Own workspace root: this example lives inside the repository but is NOT a member of the main workspace.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"   # keep unwind: the SDK catches panics at the plugin boundary (catch_unwind)
